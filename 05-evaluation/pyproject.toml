[project]
name = "model-course-05-evaluation"
version = "0.1.0"
description = "Build a model evaluation harness: a build-first model engineering course"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.6,<2.8", "numpy>=2.1,<3"]

[project.scripts]
course = "course_cli.main:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-timeout>=2.3,<3", "ruff>=0.11,<0.12"]
gpu = ["modal>=1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learner", "course_cli", "grader"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["grader"]
timeout = 30
markers = ["gpu: requires actual CUDA hardware", "distributed: launches real worker processes"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
